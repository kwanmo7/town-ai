spring:
  application:
    name: town-ai

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

town-ai:
  user-time-zone: ${USER_TIME_ZONE:Asia/Tokyo}
  firestore:
    project-id: ${FIRESTORE_PROJECT_ID:${FIREBASE_PROJECT_ID:town-ai}}
    database-id: ${FIRESTORE_DATABASE_ID:town-ai}
    emulator-host: ${FIRESTORE_EMULATOR_HOST:}
  web-auth:
    enabled: ${WEB_AUTH_ENABLED:false}
    firebase-project-id: ${FIREBASE_PROJECT_ID:town-ai}
    allowed-uid: ${FIREBASE_ALLOWED_UID:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    report-model: ${OPENAI_REPORT_MODEL:gpt-5.6-luna}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
    read-timeout: ${OPENAI_READ_TIMEOUT:120s}
  report-storage:
    type: ${REPORT_STORAGE_TYPE:local}
    local-directory: ${REPORT_LOCAL_DIRECTORY:./data/reports}
    bucket-name: ${GCS_BUCKET_NAME:}
  report-link:
    signing-secret: ${REPORT_LINK_SIGNING_SECRET:}
    validity: ${REPORT_LINK_VALIDITY:30d}
  line:
    channel-secret: ${LINE_CHANNEL_SECRET:}
    channel-access-token: ${LINE_CHANNEL_ACCESS_TOKEN:}
    allowed-user-id: ${LINE_ALLOWED_USER_ID:}
    messaging-api-base-url: ${LINE_MESSAGING_API_BASE_URL:https://api.line.me}
    messaging-api-connect-timeout: ${LINE_MESSAGING_API_CONNECT_TIMEOUT:5s}
    messaging-api-read-timeout: ${LINE_MESSAGING_API_READ_TIMEOUT:15s}
    report-base-url: ${LINE_REPORT_BASE_URL:${LINE_CLOUD_TASKS_OIDC_AUDIENCE:http://localhost:8080}}
    event-dispatcher: ${LINE_EVENT_DISPATCHER:local}
    local-task-target-url: ${LINE_LOCAL_TASK_TARGET_URL:http://localhost:8080/internal/tasks/line-events}
    cloud-tasks-project-id: ${GCP_PROJECT_ID:}
    cloud-tasks-location: ${GCP_REGION:asia-northeast1}
    cloud-tasks-queue: ${LINE_CLOUD_TASKS_QUEUE:line-events}
    cloud-tasks-target-url: ${LINE_CLOUD_TASKS_TARGET_URL:}
    cloud-tasks-oidc-audience: ${LINE_CLOUD_TASKS_OIDC_AUDIENCE:}
    cloud-tasks-service-account: ${LINE_CLOUD_TASKS_SERVICE_ACCOUNT:}
